[package]
name = "kollega-policy"
version.workspace = true
edition.workspace = true
description = "Moteur de décision sur les appels d'outils — partie pure (invariant 2)"

[dependencies]
kollega-core = { path = "../kollega-core" }
# La requête d'appel voyage dans l'état de tâche persisté (la machine la
# transporte jusqu'au moteur) : elle doit être sérialisable. Pur, sans E/S.
serde = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
proptest = "1"
