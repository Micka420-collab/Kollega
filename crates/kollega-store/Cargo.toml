[package]
name = "kollega-store"
version.workspace = true
edition.workspace = true
description = "Persistance PostgreSQL — point de passage unique vers la base"

# Le pilote de la tranche verticale câble runtime, policy et audit
# AU-DESSUS du point de passage unique — arêtes prévues par le graphe gelé
# (kollega-store est de rang UPPER dans dependency_graph.rs).
[dependencies]
hex.workspace = true
# `storage-boundary` : SEUL consommateur légitime de
# `ContentDigest::from_storage` — relire une empreinte persistée sans la
# recalculer. La garde textuelle de kollega-cli échoue si un autre crate
# l'invoque.
kollega-audit = { path = "../kollega-audit", features = ["storage-boundary"] }
kollega-core = { path = "../kollega-core" }
kollega-policy = { path = "../kollega-policy" }
kollega-runtime = { path = "../kollega-runtime" }
log.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
