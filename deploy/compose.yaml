# Démarrage local / client : podman compose --file deploy/compose.yaml up
# Prérequis : définir KOLLEGA_DB_PASSWORD dans l'environnement (jamais dans ce fichier).
# Première mise en route : podman compose run --rm app migrate
services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kollega
      POSTGRES_USER: kollega
      POSTGRES_PASSWORD: ${KOLLEGA_DB_PASSWORD:?definir KOLLEGA_DB_PASSWORD}
    volumes:
      - kollega-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kollega -d kollega"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    image: localhost/kollega:dev
    environment:
      DATABASE_URL: postgres://kollega:${KOLLEGA_DB_PASSWORD:?definir KOLLEGA_DB_PASSWORD}@db:5432/kollega
      KOLLEGA_LISTEN: 0.0.0.0:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  kollega-db:
