# Démarrage local :
#   1) migrations : podman compose --file deploy/compose.yaml --profile setup run --rm migrate
#   2) serveur    : podman compose --file deploy/compose.yaml up
# Prérequis, définis dans l'environnement (jamais dans ce fichier) :
#   KOLLEGA_MIGRATE_DB_PASSWORD  — rôle kollega_migrate (service migrate uniquement)
#   KOLLEGA_APP_DB_PASSWORD      — rôle kollega_app
services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kollega
      POSTGRES_USER: kollega_migrate
      POSTGRES_PASSWORD: ${KOLLEGA_MIGRATE_DB_PASSWORD:?definir KOLLEGA_MIGRATE_DB_PASSWORD}
    volumes:
      - kollega-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kollega_migrate -d kollega"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Service ponctuel : SEUL détenteur des identifiants kollega_migrate
  # (propriétaire du schéma). Le serveur exposé au réseau ne les possède
  # jamais — défense en profondeur de l'invariant 1.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    image: localhost/kollega:dev
    profiles: ["setup"]
    command: ["migrate"]
    environment:
      KOLLEGA_MIGRATE_DATABASE_URL: postgres://kollega_migrate:${KOLLEGA_MIGRATE_DB_PASSWORD:?definir KOLLEGA_MIGRATE_DB_PASSWORD}@db:5432/kollega
      KOLLEGA_APP_DB_PASSWORD: ${KOLLEGA_APP_DB_PASSWORD:?definir KOLLEGA_APP_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    image: localhost/kollega:dev
    environment:
      # L'application ne se connecte QU'AVEC kollega_app (sans BYPASSRLS).
      DATABASE_URL: postgres://kollega_app:${KOLLEGA_APP_DB_PASSWORD:?definir KOLLEGA_APP_DB_PASSWORD}@db:5432/kollega
      KOLLEGA_LISTEN: 0.0.0.0:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  kollega-db:
