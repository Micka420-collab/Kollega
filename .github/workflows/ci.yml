# EXÉCUTÉ depuis le 28/07/2026 : run n°1 (30223145565) verte — isolation
# RLS sur base réelle, image, SBOM et signature cosign validés ; run n°2
# (30223419721, branche jetable, politique RLS retirée) ROUGE — preuve que
# le test d'isolation sait échouer. Le différentiel canonical.py tourne
# depuis la run n°4 ; la réversibilité des migrations est jouée par le job
# « reversibilite » (up → down → diff avec l'état vierge → re-up → diff).
#
# Intégration continue : fmt → clippy → tests (dont graphe de dépendances,
# isolation RLS et filet structurel sur base réelle) → image → SBOM →
# signature cosign → publication.
#
# DURCISSEMENT (nuit du 28 au 29/07) : toutes les actions sont épinglées
# PAR SHA — un tag mobile comme `@v4` est réécrivable par son mainteneur
# (ou par qui prend son compte), et cette CI est le seul instrument de
# preuve du projet : « la CI est verte » n'a de valeur que si l'on sait
# QUEL code l'a rendue verte. La version lisible reste en commentaire à
# côté, sans quoi on épinglerait sans savoir quoi. Les commandes cargo
# passent en `--locked` : un Cargo.lock désynchronisé échoue ici au lieu
# de n'apparaître qu'au build d'image, sur main seulement.
name: ci

on:
  push:
    # `worktree-**` ajoutée dans la nuit du 29 au 30/07 : les tests qui
    # exigent PostgreSQL ne s'exécutent NULLE PART ailleurs qu'ici (le poste
    # de travail n'a ni base ni pgvector), et une branche de travail ne
    # déclenchait la CI qu'en ouvrant une pull request — impossible sans
    # l'outil `gh`, absent du poste. Une preuve qu'on ne peut pas faire
    # tourner n'est pas une preuve. Outillage réversible : à retirer le jour
    # où les branches de travail passent par une pull request.
    branches: [main, "worktree-**"]
  pull_request:

jobs:
  verifications:
    runs-on: ubuntu-latest
    permissions:
      # Publication du diagnostic d'échec sur une branche lisible en
      # anonyme : les journaux de job exigent un jeton pour être LUS, ce
      # qui rend un rouge indéchiffrable depuis un poste sans secret.
      contents: write
    services:
      postgres:
        # pgvector inclus : la migration 0001 crée l'extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kollega
          POSTGRES_USER: kollega_migrate
          # Mot de passe jetable d'un conteneur éphémère de CI — pas un secret.
          POSTGRES_PASSWORD: ci_migrate
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U kollega_migrate -d kollega"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Active le test d'isolation RLS (invariant 1) sur une base réelle.
      TEST_MIGRATE_DATABASE_URL: postgres://kollega_migrate:ci_migrate@localhost:5432/kollega
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (graphe de dépendances + isolation RLS sur base réelle)
        # `--no-fail-fast` (29/07) : sans lui, cargo s'arrête au PREMIER
        # binaire en échec et n'exécute jamais les suivants. Le diagnostic
        # publié ne montrait alors qu'une partie des dégâts, et — pire — un
        # test pouvait passer pour « n'ayant rien détecté » alors qu'il
        # n'avait pas tourné du tout. C'est arrivé deux fois le même jour,
        # dont une où j'ai failli consigner qu'une preuve était insensible.
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test-out.txt
      - name: Publier le diagnostic des tests (branche lisible en anonyme)
        if: failure()
        run: |
          mkdir -p diag
          # Les échecs et leurs assertions, isolés du bruit des tests verts.
          grep -E "^(test .*FAILED|failures:|---- .* ----|thread )" -A 12 test-out.txt \
            > diag/echecs.txt 2>/dev/null || true
          tail -c 60000 test-out.txt > diag/queue.txt
          cd diag
          git init -q -b ci-diagnostic-tests
          git config user.email "ci@kollega.invalid"
          git config user.name "CI diagnostic"
          git add -A
          git commit -qm "diagnostic tests run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-diagnostic-tests
      - name: Différentiel encodage canonique Rust <-> Python
        # Deux implémentations écrites indépendamment depuis la spec ; toute
        # divergence est un défaut de SPÉCIFICATION à documenter, pas un bug
        # à corriger en douce (tools/reference/README.md).
        run: |
          # Chemin ABSOLU : cargo exécute les tests d'intégration avec la
          # crate (pas la racine du workspace) pour répertoire courant.
          DIFF_VECTORS_DIR="$(pwd)/target/diff" cargo test -p kollega-audit --locked --test diff_vectors
          python3 tools/reference/canonical.py < target/diff/vectors.jsonl > target/diff/py.out
          python3 tools/reference/canonical.py --hashes < target/diff/hashes.jsonl > target/diff/py-hashes.out
          if ! diff -u target/diff/rust.out target/diff/py.out > target/diff/delta.txt; then
            echo "DIVERGENCE D'ENCODAGE Rust/Python — premières lignes :"
            head -c 2000 target/diff/delta.txt
            exit 1
          fi
          if ! diff -u target/diff/rust-hashes.out target/diff/py-hashes.out > target/diff/delta-hashes.txt; then
            echo "DIVERGENCE D'EMPREINTE Rust/Python — premières lignes :"
            head -c 2000 target/diff/delta-hashes.txt
            exit 1
          fi
          echo "encodages compares : $(wc -l < target/diff/rust.out)"
          echo "empreintes comparees : $(wc -l < target/diff/rust-hashes.out)"
          test "$(wc -l < target/diff/rust.out)" -ge 12000

  reversibilite:
    # Invariant 13 : les .down.sql doivent avoir TOURNÉ, pas seulement
    # exister. Job séparé avec son PROPRE cluster : les rôles PostgreSQL
    # sont globaux au cluster, jouer DROP ROLE dans le cluster du job de
    # tests casserait ses connexions.
    runs-on: ubuntu-latest
    permissions:
      # Publication du diagnostic sur la branche ci-diagnostic : les
      # journaux et le résumé de job exigent un jeton pour être LUS, la
      # branche est lisible en anonyme via raw.githubusercontent.com.
      contents: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kollega
          POSTGRES_USER: kollega_migrate
          POSTGRES_PASSWORD: ci_migrate
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U kollega_migrate -d kollega"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: kollega_migrate
      PGPASSWORD: ci_migrate
      PGDATABASE: kollega
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Aller-retour complet des migrations (up → down → up)
        # Tout échec est publié dans le RÉSUMÉ du job (page publique de la
        # run) : les journaux bruts exigent un jeton, le résumé non.
        run: |
          # TOUTE la sortie de l'étape est capturée, pas seulement les
          # échecs ciblés : un diagnostic vide (run n°41) ne dit rien, et
          # un rouge illisible ne vaut guère mieux qu'un vert douteux.
          exec > >(tee reversibilite-out.txt) 2>&1
          set -x
          summary() { printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          capture() {
            local label="$1"; shift
            if ! "$@" > step-out.txt 2>&1; then
              { echo "ÉCHEC — $label"; tail -c 4000 step-out.txt; } > echec.txt
              summary "### ÉCHEC — $label"
              summary '```'
              tail -c 4000 step-out.txt >> "$GITHUB_STEP_SUMMARY"
              summary '```'
              exit 1
            fi
          }
          snapshot() {
            capture "pg_dump ($1)" pg_dump --schema-only --no-owner --no-privileges -f "$1.schema.raw"
            # pg_dump >= 18 émet \restrict/\unrestrict avec un jeton
            # ALÉATOIRE par invocation : du bruit, pas du schéma — filtré
            # (faux positif attrapé aux runs 10-14, diagnostic sur la
            # branche ci-diagnostic).
            grep -v -E '^\\(un)?restrict ' "$1.schema.raw" > "$1.schema" || true
            # pg_dump ne couvre ni les rôles, ni les extensions, ni les
            # privilèges de schéma : capturés à part.
            capture "roles ($1)" psql -Atc "SELECT rolname, rolcanlogin, rolbypassrls FROM pg_roles WHERE rolname LIKE 'kollega%' ORDER BY rolname" -o "$1.roles"
            capture "extensions ($1)" psql -Atc "SELECT extname FROM pg_extension ORDER BY extname" -o "$1.ext"
            # ACL EFFECTIVE, pas texte brut : nspacl NULL (jamais touché) et
            # nspacl matérialisé aux entrées par défaut sont le même état.
            capture "acl ($1)" psql -Atc "SELECT a.grantee::regrole::text, a.privilege_type FROM pg_namespace n, LATERAL aclexplode(COALESCE(n.nspacl, acldefault('n', n.nspowner))) a WHERE n.nspname = 'public' ORDER BY 1, 2" -o "$1.acl"
            # PRIVILÈGES DE TABLE (29/07) : `pg_dump --no-privileges` les
            # retire du schéma, et l'ACL ci-dessus ne couvre que le SCHÉMA
            # public. Les GRANT/REVOKE par table n'étaient donc comparés
            # NULLE PART — alors qu'ils sont le mécanisme même de
            # l'invariant 12 (« aucune suppression physique » tient parce
            # que le rôle n'a pas DELETE). Une migration qui accordait un
            # privilège sans le reprendre à la descente passait verte.
            capture "acl tables ($1)" psql -Atc "SELECT c.relname, a.grantee::regrole::text, a.privilege_type FROM pg_class c, LATERAL aclexplode(COALESCE(c.relacl, acldefault('r', c.relowner))) a WHERE c.relnamespace = 'public'::regnamespace AND c.relkind IN ('r', 'v', 'm', 'S') ORDER BY 1, 2, 3" -o "$1.tacl"
          }
          apply()  { for f in migrations/*.up.sql;            do capture "up: $f"   psql -v ON_ERROR_STOP=1 -f "$f"; done; }
          revert() { for f in $(ls -r migrations/*.down.sql); do capture "down: $f" psql -v ON_ERROR_STOP=1 -f "$f"; done; }

          summary "## Réversibilité des migrations — $(psql --version)"
          capture "version serveur" psql -Atc "SELECT version()" -o server-version.txt
          summary "serveur : $(cat server-version.txt)"
          snapshot vierge
          apply
          snapshot apres-up-1
          revert
          snapshot apres-down
          fail=0
          for part in schema roles ext acl tacl; do
            if ! diff "vierge.$part" "apres-down.$part" > "delta-down-$part.txt"; then
              fail=1
              summary "### DIVERGENCE down↩vierge ($part)"
              summary '```'
              head -c 4000 "delta-down-$part.txt" >> "$GITHUB_STEP_SUMMARY"
              summary '```'
            fi
          done
          apply
          snapshot apres-up-2
          for part in schema roles ext acl tacl; do
            if ! diff "apres-up-1.$part" "apres-up-2.$part" > "delta-reup-$part.txt"; then
              fail=1
              summary "### DIVERGENCE re-up ($part)"
              summary '```'
              head -c 4000 "delta-reup-$part.txt" >> "$GITHUB_STEP_SUMMARY"
              summary '```'
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          summary "réversibilité prouvée : down rend le vierge, re-up reproduit l'état"
          echo "réversibilité prouvée"
      - name: Publier le diagnostic (branche ci-diagnostic, lisible en anonyme)
        if: always()
        run: |
          mkdir -p diag
          cp -f reversibilite-out.txt diag/ 2>/dev/null || true
          cp -f echec.txt step-out.txt server-version.txt diag/ 2>/dev/null || true
          cp -f vierge.* apres-up-1.* apres-down.* apres-up-2.* delta-*.txt diag/ 2>/dev/null || true
          cd diag
          ls -la > index.txt
          git init -q -b ci-diagnostic
          git config user.email "ci@kollega.invalid"
          git config user.name "CI diagnostic"
          git add -A
          git commit -qm "diagnostic reversibilite run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-diagnostic

  image:
    needs: verifications
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # signature cosign sans clé (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Nom d'image en minuscules (exigence des références OCI)
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/kollega" >> "$GITHUB_ENV"
      - name: Connexion au registre
        # docker/login-action écrit ~/.docker/config.json, lu par podman,
        # syft ET cosign — un podman login seul serait invisible pour cosign
        # (XDG_RUNTIME_DIR n'est pas défini sur les runners hébergés).
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire l'image
        run: podman build -f deploy/Containerfile -t "$IMAGE:${{ github.sha }}" .
      - name: Publier et capturer le digest
        # La signature porte sur le digest immuable, pas sur un tag mutable.
        run: |
          podman push --digestfile image.digest "$IMAGE:${{ github.sha }}"
          echo "IMAGE_REF=$IMAGE@$(cat image.digest)" >> "$GITHUB_ENV"
      - name: SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Installer cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Signer l'image (sans clé, OIDC)
        run: cosign sign --yes "$IMAGE_REF"
      - name: Attester le SBOM
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE_REF"
      - name: VÉRIFIER la signature et l'attestation (29/07)
        # Signer et ne jamais vérifier, c'est prouver que `cosign sign` rend
        # 0 — pas que quiconque peut authentifier l'image. Une signature
        # qu'on n'a jamais su valider n'est pas une garantie, c'est une
        # dépense. Cette étape est donc le PREMIER endroit où l'affirmation
        # « image signée » est mise à l'épreuve.
        #
        # L'identité est ÉPINGLÉE, pas laissée libre : accepter n'importe
        # quel signataire reviendrait à vérifier qu'une signature existe
        # sans vérifier de QUI elle vient — ce qui ne vaut rien. Le job ne
        # tournant que sur une poussée dans main, l'identité exacte est
        # connue : c'est ce workflow, sur cette référence.
        #
        # L'échec est écrit dans le RÉSUMÉ de la run, lisible sans jeton :
        # les journaux bruts n'en sont pas, et un rouge indéchiffrable ne
        # vaut guère mieux qu'un vert douteux.
        run: |
          IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}"
          ISSUER="https://token.actions.githubusercontent.com"
          verifier() {
            label="$1"; shift
            if ! "$@" > verif-out.txt 2>&1; then
              {
                echo "### ÉCHEC — $label"
                echo "identité attendue : $IDENTITY"
                echo '```'
                tail -c 3000 verif-out.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          }
          verifier "cosign verify (signature de l'image)" \
            cosign verify --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$IMAGE_REF"
          verifier "cosign verify-attestation (SBOM)" \
            cosign verify-attestation --type spdxjson \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$IMAGE_REF"
          echo "signature ET attestation SBOM vérifiées pour $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.spdx.json
